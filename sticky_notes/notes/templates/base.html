{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sticky Notes{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="{% url 'notes:list' %}">Sticky Notes<span class="brand-dot" aria-hidden="true"></span></a>
    <nav aria-label="Main navigation"><a href="{% url 'notes:list' %}">My board</a><a class="button button-small" href="{% url 'notes:create' %}">New note</a></nav>
  </header>
  <main id="main-content" class="page" tabindex="-1">
    {% if messages %}<div class="messages" role="status">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer"><p>A little space for what matters.</p><a href="{% url 'notes:list' %}">Back to board</a></footer>
</body>
</html>
